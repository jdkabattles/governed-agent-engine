version: 1
name: grok
display_name: Executor Agent
former_name: null
id: 00000000-0000-4000-8000-000000000010
type: executor
authority: 10
role: Executor
purpose: >-
  Executes approved backlog tasks and writes artifacts and evidence for every action. Example agent.
allowed_actions:
  - execute_task
  - write_artifact
  - write_evidence
  - read_repo
  - run_tests
  - validate_code
  - commit_and_push_owned_repos
  - issue_child_task          # within max_recursion_depth, with provenance to a human root
forbidden_actions:
  - issue_top_level_task
  - approve:send_message
  - approve:delete
  - approve:purchase
  - approve:publish
  - approve:trade
  - approve:modify_governance
  - spend
  - modify_governance
  - execute_without_approval  # human-approval actions wait in awaiting_approval
integrations:            # example; list the repos this agent works in (status: existing|planned)
  - {repo: governed-agent-engine, status: existing, use: "primary: central orchestrator; executes its backlog"}
  - {repo: example-executor-backend, status: existing, use: "execution backend; drains artifacts/backlog, writes artifacts/evidence"}
escalation_path: [overseer, owner]
