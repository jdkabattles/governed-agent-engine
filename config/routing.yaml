# Router + strategy are config-driven. Chains define WHICH endpoints may serve a task type.
# ORDER: when config/capabilities.yaml exists (generated by `gae bench`), the strategy orders
# chain members by measured utility for the task type; the order
# below is only the fallback when no capability data is present. Health, rate limits (shared
# per rate_group) and knowledge policy are applied on top.
default_executor: grok
default_chain: [groq_gpt_oss_120b, groq_gpt_oss_20b, groq_qwen3_8_27b, pollinations, ovh, llm7,
                openrouter_nemotron_super, openrouter_north_code, openrouter_laguna_s, openrouter,
                gemini, ai_horde]
task_types:
  research: [ovh, groq_qwen3_8_27b, groq_gpt_oss_120b, pollinations, openrouter_nemotron_super,
             llm7, gemini, ai_horde]
  repo_maintain: [groq_gpt_oss_120b, groq_gpt_oss_20b, pollinations, ovh, llm7, groq_qwen3_8_27b,
                  openrouter_north_code, openrouter_nemotron_super, openrouter_laguna_s]
  market_watch: [groq_qwen3_8_27b, groq_gpt_oss_120b, ovh, pollinations,
                 openrouter_nemotron_super, llm7, gemini]
# These types never go to Grok; they are always planned by free cognition.
cognition_only_types: [governance_check]
